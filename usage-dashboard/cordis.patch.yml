# The dsh-usage-dashboard bundle patch: installs the complete usage dashboard
# over a base-backed web profile (dsh-web-app), composing BOTH the Host
# capability (usage-report) and the browser dashboard (ui-usage). A profile
# without this bundle has neither the report Remote methods nor any dashboard
# UI — the base workspace controller stays unmodified.
#
# Install into a profile with:  dsh plugin --profile web add @deepseek-ai/dsh-usage-dashboard
- insert:
    # Host: the per-workspace usage report and raw session-log read.
    - id: usage-report
      name: '@deepseek-ai/dsh-usage-report'

    # Browser: the sidebar footer action and its full-viewport report.
    - id: ui-usage
      name: '@deepseek-ai/dsh-client-ui-usage'
