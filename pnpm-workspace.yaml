# Single package, no workspace members: this file exists for the settings,
# which pnpm 10+ reads here rather than from .npmrc.
packages:
  - .

# The harness packages are peerDependencies the profile supplies at run time
# from its own module fallback; `tools/link-harness.mjs` links a checkout for
# building. pnpm must never fetch them from the registry — the same setting the
# dsh profile directory uses.
autoInstallPeers: false
strictPeerDependencies: false
